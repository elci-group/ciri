[[file]]
path = "Cargo.toml"
required = true
forbid_regex = ["TODO", "FIXME"]

[[file]]
path = "src/main.rs"
required = true
min_size_bytes = 500
forbid_regex = ["TODO", "FIXME", "unimplemented!"]

[[file]]
path = "README.md"
required = true
min_size_bytes = 500
forbid_regex = ["TODO", "FIXME"]

[[command]]
name = "cargo test"
cmd = ["cargo", "test", "--all-targets"]
expect_exit = 0
timeout_secs = 120
stdout_contains = ["test result: ok"]

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "release build"
cmd = ["cargo", "build", "--release"]
expect_exit = 0
timeout_secs = 120

[git]
no_uncommitted_changes = false
no_untracked_files = false
